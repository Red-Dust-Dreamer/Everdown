<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深渊放置 · 本地管理面板</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* ============ 管理面板自有微调(壳与词汇沿用 style.css) ============ */
  html,body{overflow:hidden}
  #app{flex:1;display:flex;flex-direction:column;min-height:0}
  #admin-top{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:none;
    background:linear-gradient(180deg,#12121e,#0e0e17);border-bottom:1px solid var(--line)}
  #admin-top .logo{color:var(--gold);font-weight:800;font-size:16px;letter-spacing:2px;white-space:nowrap}
  #admin-tabs{display:flex;gap:4px;flex-wrap:wrap}
  #admin-body{flex:1;display:flex;min-height:0}
  #admin-side{width:190px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
  #admin-content{flex:1;min-width:0;overflow:auto;padding:14px}
  .page{display:none;flex-direction:column;gap:12px;min-width:0}
  .page.on{display:flex}
  /* 表单控件(style.css 只给 .login-form 定义过 input,这里面板全局补齐) */
  #admin-content input[type=text],#admin-content input[type=number],
  #admin-content select,#admin-content textarea{
    background:#10101a;border:1px solid var(--line2);border-radius:6px;color:var(--txt);
    padding:5px 8px;font-size:13px;font-family:inherit;outline:none;min-width:0}
  #admin-content input:focus,#admin-content select:focus,#admin-content textarea:focus{border-color:#3a5a7a}
  #admin-content textarea{width:100%;min-height:90px;resize:vertical;font-family:Consolas,monospace;font-size:12px}
  /* 数值覆盖表 */
  .ov-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .ov-table th{position:sticky;top:0;background:var(--panel2);color:var(--dim);text-align:left;
    padding:6px 8px;border-bottom:1px solid var(--line2);font-weight:600;white-space:nowrap;z-index:2}
  .ov-table td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .ov-table tr:hover td{background:#16162466}
  .ov-table .path{font-family:Consolas,monospace;color:#9ad1ff;white-space:nowrap}
  .ov-table .lock{color:var(--dim)}
  .ov-table input[type=number]{width:110px}
  .ov-table input[type=text]{width:150px}
  .ov-changed{color:var(--gold);font-weight:700}
  .ov-warn{color:#ffb84a}
  .muted{color:var(--dim)}
  .small{font-size:12px}
  .danger-note{color:#ff8a8a;font-size:12px;line-height:1.7}
  /* 编辑器通用 */
  .fld{display:flex;align-items:center;gap:8px;margin:3px 0;flex-wrap:wrap}
  .fld label{width:150px;flex:none;color:var(--dim);font-size:12.5px}
  .grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .grp>h4{font-size:13px;color:var(--txt);margin-bottom:6px;display:flex;gap:8px;align-items:center}
  .kv-row{display:flex;gap:6px;align-items:center;margin:2px 0;flex-wrap:wrap}
  .issue{display:block;padding:3px 8px;border-radius:6px;margin:2px 0;cursor:pointer;font-size:12.5px}
  .issue.error{color:#ff8a8a;background:#2a1616}
  .issue.warn{color:#ffb84a;background:#2a2416}
  .issue:hover{filter:brightness(1.3)}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
    border:1px solid var(--line2);color:var(--dim)}
  .badge.ok{color:#6bff8f;border-color:#3a6a4a}
  .badge.err{color:#ff8a8a;border-color:#5c2a2a}
  table.cmp{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  table.cmp th,table.cmp td{border:1px solid var(--line);padding:3px 8px;text-align:right}
  table.cmp th{color:var(--dim);font-weight:600}
  .svg-wrap{background:#0d0d16;border:1px solid var(--line);border-radius:10px;padding:8px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--dim);padding:4px 8px}
  .legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  details>summary{cursor:pointer;color:#9ad1ff;font-size:13px;margin:6px 0}
  pre.code{background:#0d0d16;border:1px solid var(--line);border-radius:8px;padding:10px;
    font-family:Consolas,monospace;font-size:12px;overflow:auto;max-height:320px;white-space:pre}
  #admin-toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#1d2a3a;color:#cde6ff;border:1px solid #3a5a7a;border-radius:8px;padding:10px 20px;
    font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;max-width:80vw}
  #admin-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bak-list button{display:block;margin:2px 0}
  @media (max-width:760px){
    #admin-side{display:none}
    .fld label{width:110px}
  }
</style>
</head>
<body>
<div id="app">
  <header id="admin-top">
    <span class="logo">🛠 深渊放置 · 本地管理面板</span>
    <span class="badge" id="bridge-badge">dev 桥:探测中…</span>
    <span class="sp"></span>
    <nav id="admin-tabs">
      <button class="btn" data-tab="save">存档管理</button>
      <button class="btn" data-tab="ov">数值覆盖</button>
      <button class="btn" data-tab="pv">效果预览</button>
      <button class="btn" data-tab="help">说明</button>
    </nav>
  </header>
  <div id="admin-body">
    <aside id="admin-side"></aside>
    <main id="admin-content">
      <div class="page" id="page-save"></div>
      <div class="page" id="page-ov"></div>
      <div class="page" id="page-pv"></div>
      <div class="page" id="page-help"></div>
    </main>
  </div>
</div>
<div id="admin-toast"></div>
<script type="module" src="./admin.ts"></script>
</body>
</html>
