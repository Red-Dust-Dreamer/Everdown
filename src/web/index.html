<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深渊挂机 · Abyss Idle</title>
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link rel="preload" href="/fonts/abyss-mono.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "AbyssMono";
    src: url("/fonts/abyss-mono.woff2") format("woff2");
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0a0f; }
  body {
    display: flex; flex-direction: column;
    font-family: "AbyssMono", monospace;
    color: #c8c8d0; overflow: hidden;
  }
  #topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 16px; background: #10101a; border-bottom: 1px solid #26263a;
    font-size: 14px; flex: none;
  }
  #topbar .title { color: #ff6b6b; font-weight: bold; font-size: 16px; }
  #topbar .sub { color: #4a4a60; }
  #topbar .sp { flex: 1; }
  #topbar button {
    background: #1b1b2a; color: #9ad1ff; border: 1px solid #33334d;
    padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 13px;
    border-radius: 3px;
  }
  #topbar button:hover { background: #26263a; }
  #stage { flex: 1; min-height: 0; position: relative; }
  #term { width: 100%; height: 100%; padding: 6px 0; }
  /* 加载遮罩:核心是本地 TS,秒开 —— 纯 CSS 一闪即隐(main.ts 就绪后加 .hide) */
  #loading {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: #0a0a0f;
    opacity: 1; transition: opacity .35s ease;
    pointer-events: none;
  }
  #loading .logo { font-size: 26px; color: #ff6b6b; font-weight: bold; letter-spacing: 4px; }
  #loading .bar { width: 220px; height: 3px; background: #1b1b2a; border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: #9ad1ff;
    border-radius: 2px; animation: flash .9s ease-in-out infinite; }
  @keyframes flash { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
  #loading.hide { opacity: 0; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #16162a; border: 1px solid #33334d; color: #9ad1ff;
    padding: 8px 18px; font-size: 13px; border-radius: 4px; z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #toast.show { opacity: 1; }
  /* 小屏提示:窗口不足以容纳 100×30 终端时覆盖显示 */
  #viewport-hint { display: none; }
  @media (max-width: 820px), (max-height: 560px) {
    #viewport-hint { display: flex; }
  }
  #viewport-hint {
    position: absolute; inset: 0; z-index: 30; align-items: center; justify-content: center;
    background: rgba(10,10,15,.96); color: #ffd166; font-size: 15px; text-align: center;
    padding: 20px; line-height: 1.9;
  }
</style>
</head>
<body>
  <div id="topbar">
    <span class="title">⚔ 深渊挂机</span>
    <span class="sub">终端放置刷宝 · 网页版</span>
    <span class="sp"></span>
    <button id="btn-save">存档 (S)</button>
    <button id="btn-export">导出</button>
    <button id="btn-import">导入</button>
    <button id="btn-reset">重置</button>
  </div>
  <div id="stage">
    <div id="term"></div>
    <div id="loading">
      <div class="logo">⚔ 深渊挂机</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="viewport-hint">窗口太小了,<br>请把浏览器窗口调大(至少 100 列 × 30 行)<br>或用横屏 / 桌面浏览器打开</div>
  </div>
  <div id="toast"></div>

  <input type="file" id="file-input" accept=".json" style="display:none">

  <!-- xterm UMD(本地 vendor,无 CDN 回退) -->
  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/xterm/addon-fit.js"></script>
  <script type="module" src="/main.ts"></script>
</body>
</html>
